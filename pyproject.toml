[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

# 1. 默认使用清华源
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 2. 新增：为 torch 指定 CPU 版本专属源
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# 3. 新增：强制 torch 从 CPU 源下载
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]