<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f9f6">
    <meta name="documind-api-base" content="">
    <title>DocuMind — 你的 AI 知识助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: "#20251f",
                        muted: "#7c8379",
                        canvas: "#f8f9f6",
                        line: "#e9ece6",
                        accent: "#526b4f",
                        "accent-dark": "#3e563c",
                        "accent-soft": "#edf3e9"
                    },
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"]
                    },
                    boxShadow: {
                        panel: "0 8px 32px rgba(34, 46, 31, 0.045)",
                        float: "0 10px 30px rgba(34, 46, 31, 0.1)"
                    }
                }
            }
        };
    </script>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; }
        .message-content { white-space: pre-wrap; overflow-wrap: anywhere; }
        .soft-grid {
            background-image: radial-gradient(#dfe5da 0.7px, transparent 0.7px);
            background-size: 18px 18px;
        }
        .typing-dot { animation: pulse 1.2s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        .message-enter { animation: message-enter 280ms cubic-bezier(0.2, 0.75, 0.3, 1) both; }
        .assistant-streaming {
            border-color: #dce6d7;
            animation: stream-glow 2s ease-in-out infinite;
        }
        .thinking-shimmer {
            background: linear-gradient(90deg, #eef1eb 20%, #f8faf6 45%, #eef1eb 70%);
            background-size: 220% 100%;
            animation: shimmer 1.6s ease-in-out infinite;
        }
        .send-button { transition: background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease; }
        .send-button:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(62, 86, 60, 0.2); }
        .send-button:not(:disabled):active { transform: translateY(0) scale(0.97); }
        .send-button.is-loading { width: auto; min-width: 104px; padding: 0 12px; background: #71846b; }
        .send-button.is-loading .send-label { display: inline; }
        .send-button.is-loading .send-arrow { display: none; }
        .send-label { display: none; }
        .send-spinner { display: none; }
        .send-button.is-loading .send-spinner { display: block; animation: spin 900ms linear infinite; }
        @keyframes message-enter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }
        @keyframes shimmer { to { background-position: -220% 0; } }
        @keyframes stream-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(34, 46, 31, 0.045); }
            50% { box-shadow: 0 8px 32px rgba(82, 107, 79, 0.12); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { border-radius: 999px; background: #dce2d8; }
    </style>
</head>
<body class="bg-canvas font-sans text-ink antialiased">
    <div class="min-h-screen lg:flex">
        <aside class="flex w-full flex-col border-b border-line bg-white lg:min-h-screen lg:w-[288px] lg:border-b-0 lg:border-r">
            <div class="flex items-center justify-between px-5 py-4 lg:px-6 lg:py-6">
                <a href="/" class="flex items-center gap-3" aria-label="DocuMind 首页">
                    <span class="flex h-10 w-10 items-center justify-center rounded-[14px] bg-accent text-white shadow-sm">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M7 3.75h6.75L19 9v10.25A1.75 1.75 0 0 1 17.25 21h-10.5A1.75 1.75 0 0 1 5 19.25V5.5a1.75 1.75 0 0 1 2-1.75Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M13 4v5h5M8.5 13h7M8.5 16.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>
                        <span class="block text-[15px] font-semibold tracking-tight">DocuMind</span>
                        <span class="mt-0.5 block text-[11px] font-medium tracking-[0.12em] text-muted">PERSONAL KNOWLEDGE</span>
                    </span>
                </a>
                <span class="rounded-full border border-line px-2.5 py-1 text-[11px] font-medium text-muted lg:hidden">工作区</span>
            </div>

            <div class="px-4 pb-4 lg:px-5">
                <div class="rounded-2xl border border-[#e8ede4] bg-[#f7f9f5] p-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="h-2 w-2 rounded-full bg-[#82a878]"></span>
                            <span class="text-xs font-semibold text-[#596655]">我的知识库</span>
                        </div>
                        <span class="text-[11px] text-muted">本地空间</span>
                    </div>
                    <p class="mt-2 text-xs leading-5 text-muted">只从你导入的文档中查找答案。</p>
                </div>
            </div>

            <div class="hidden flex-1 px-5 pt-2 lg:block">
                <div class="mb-3 flex items-center justify-between px-1">
                    <h2 class="text-[11px] font-semibold uppercase tracking-[0.13em] text-[#92998f]">资料来源</h2>
                    <svg class="h-4 w-4 text-[#9ba297]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                </div>
                <div id="sidebarEmpty" class="rounded-xl border border-dashed border-[#dfe5dc] px-3 py-4 text-center">
                    <div class="mx-auto flex h-9 w-9 items-center justify-center rounded-xl bg-[#f0f3ed] text-[#81907c]">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M7 3.75h6.75L19 9v10.25A1.75 1.75 0 0 1 17.25 21h-10.5A1.75 1.75 0 0 1 5 19.25V5.5a1.75 1.75 0 0 1 2-1.75Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M13 4v5h5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <p class="mt-2 text-xs font-medium text-[#697166]">还没有已索引的文档</p>
                    <p class="mt-1 text-[11px] text-[#9ba297]">导入 PDF 开始提问</p>
                </div>
                <div id="sidebarDocument" class="hidden items-center gap-2.5 rounded-xl border border-[#e8ede4] bg-[#f9faf8] px-3 py-3">
                    <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-[#f0e8e3] text-[10px] font-bold text-[#987568]">PDF</span>
                    <span id="sidebarDocumentName" class="min-w-0 truncate text-xs font-medium text-[#596254]"></span>
                </div>
            </div>

            <div class="hidden border-t border-line p-5 lg:block">
                <div class="flex items-center gap-2.5">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[#edf0e9] text-xs font-semibold text-[#61705b]">DM</span>
                    <div>
                        <p class="text-xs font-semibold">私人工作区</p>
                        <p class="mt-0.5 text-[11px] text-muted">你的文档只属于你</p>
                    </div>
                    <svg class="ml-auto h-4 w-4 text-[#a2a89f]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="m8 10 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </aside>

        <main class="flex min-h-[calc(100vh-91px)] min-w-0 flex-1 flex-col lg:min-h-screen">
            <header class="flex items-center justify-between border-b border-line bg-white/75 px-5 py-3.5 backdrop-blur sm:px-8 lg:px-12">
                <div class="flex items-center gap-2 text-xs text-muted">
                    <span>工作区</span>
                    <svg class="h-3.5 w-3.5 text-[#b5bbb2]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="font-medium text-ink">智能问答</span>
                </div>
                <div class="flex items-center gap-2 rounded-full border border-[#e8ece5] bg-white px-3 py-1.5">
                    <span class="relative flex h-2 w-2">
                        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-[#9ab392] opacity-50"></span>
                        <span class="relative inline-flex h-2 w-2 rounded-full bg-[#78956f]"></span>
                    </span>
                    <span class="text-[11px] font-medium text-[#65715f]">知识助手已就绪</span>
                </div>
            </header>

            <div class="flex flex-1 flex-col">
                <section class="mx-auto flex w-full max-w-4xl flex-1 flex-col px-5 pb-5 pt-8 sm:px-8 sm:pt-12 lg:px-12">
                    <div id="welcome" class="relative mb-8 overflow-hidden rounded-[26px] border border-[#e8ece4] bg-white px-6 py-7 shadow-panel sm:px-9 sm:py-9">
                        <div class="soft-grid pointer-events-none absolute inset-y-0 right-0 hidden w-[38%] opacity-60 sm:block"></div>
                        <div class="relative max-w-2xl">
                            <div class="mb-5 inline-flex items-center gap-2 rounded-full border border-[#e4ebdf] bg-[#f6f9f3] px-3 py-1.5 text-[11px] font-semibold tracking-wide text-[#62765c]">
                                <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path d="M10 1.75 11.9 7.1l5.35 1.9-5.35 1.9L10 16.25l-1.9-5.35-5.35-1.9 5.35-1.9L10 1.75Z"/>
                                </svg>
                                YOUR AI KNOWLEDGE ASSISTANT
                            </div>
                            <h1 class="max-w-xl text-[28px] font-semibold leading-[1.2] tracking-[-0.04em] text-[#252a24] sm:text-[36px]">你好，今天想了解什么？</h1>
                            <p class="mt-3 max-w-lg text-sm leading-6 text-[#7b8378]">把文档交给我，快速找到重点、梳理信息，答案始终基于你的资料。</p>
                        </div>
                        <div class="relative mt-7 flex flex-wrap gap-2">
                            <button type="button" onclick="askSuggestion(this)" class="rounded-full border border-[#e7ebe4] bg-white px-3.5 py-2 text-xs text-[#657060] transition hover:border-[#c9d6c3] hover:bg-[#f7faf5]">帮我总结这份文档</button>
                            <button type="button" onclick="askSuggestion(this)" class="rounded-full border border-[#e7ebe4] bg-white px-3.5 py-2 text-xs text-[#657060] transition hover:border-[#c9d6c3] hover:bg-[#f7faf5]">提取里面的关键技能</button>
                            <button type="button" onclick="askSuggestion(this)" class="rounded-full border border-[#e7ebe4] bg-white px-3.5 py-2 text-xs text-[#657060] transition hover:border-[#c9d6c3] hover:bg-[#f7faf5]">有哪些值得关注的细节？</button>
                        </div>
                    </div>

                    <section class="mb-5 rounded-2xl border border-[#e8ece4] bg-white p-4 shadow-panel sm:p-5" aria-labelledby="import-title">
                        <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
                            <div class="flex min-w-0 flex-1 items-start gap-3">
                                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#f1f4ee] text-[#74836e]">
                                    <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M7 3.75h6.75L19 9v10.25A1.75 1.75 0 0 1 17.25 21h-10.5A1.75 1.75 0 0 1 5 19.25V5.5a1.75 1.75 0 0 1 2-1.75Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                                        <path d="M13 4v5h5M8.5 13h7M8.5 16.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                                <div class="min-w-0 flex-1">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <h2 id="import-title" class="text-sm font-semibold">添加知识来源</h2>
                                        <span class="rounded-md bg-[#f1f3ef] px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-[#899084]">PDF</span>
                                    </div>
                                    <p class="mt-1 text-xs leading-5 text-muted">导入本地 PDF，建立可搜索的知识索引。</p>
                                </div>
                            </div>
                            <form id="ingestForm" class="flex min-w-0 flex-col gap-2 sm:w-[390px] sm:flex-row">
                                <label for="filePath" class="sr-only">本地 PDF 文件路径</label>
                                <input id="filePath" type="text" value="./tests/刘东旭_前端开发.pdf" autocomplete="off"
                                    class="h-10 min-w-0 flex-1 rounded-xl border border-[#e5e9e2] bg-[#fcfdfb] px-3 text-xs text-[#454d42] outline-none transition placeholder:text-[#a4aaa0] focus:border-[#a8ba9f] focus:ring-4 focus:ring-[#edf3e9]">
                                <button id="ingestButton" type="submit" class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-xl bg-accent px-4 text-xs font-semibold text-white transition hover:bg-accent-dark focus:outline-none focus:ring-4 focus:ring-[#dce8d6] disabled:cursor-wait disabled:opacity-60">
                                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.25A1.75 1.75 0 0 0 6.75 20h10.5A1.75 1.75 0 0 0 19 18.25V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <span>导入文档</span>
                                </button>
                            </form>
                        </div>
                        <p id="ingestStatus" role="status" aria-live="polite" class="mt-3 hidden text-xs"></p>
                    </section>

                    <section id="conversation" class="flex-1 space-y-5 pb-4" aria-live="polite" aria-label="对话内容"></section>

                    <form id="chatForm" class="sticky bottom-4 z-10 rounded-[20px] border border-[#e3e8df] bg-white p-2.5 shadow-float sm:p-3">
                        <label for="question" class="sr-only">输入你的问题</label>
                        <textarea id="question" rows="1" placeholder="向你的知识库提问…"
                            class="max-h-36 min-h-[46px] w-full resize-none bg-transparent px-3 py-3 text-sm leading-5 text-ink outline-none placeholder:text-[#a1a79e]"
                            aria-label="输入你的问题"></textarea>
                        <div class="flex items-center justify-between border-t border-[#f0f2ee] px-1 pt-2">
                            <div class="flex items-center gap-1.5 pl-1.5 text-[11px] text-[#92998f]">
                                <svg class="h-3.5 w-3.5 text-[#8c9a84]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M12 3.5 14.5 9l5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5L4 11.5 9.5 9 12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                                </svg>
                                <span>基于已导入的文档回答</span>
                            </div>
                            <button id="sendButton" type="submit" aria-label="发送问题" class="send-button flex h-9 w-9 items-center justify-center gap-2 rounded-xl bg-accent text-white hover:bg-accent-dark focus:outline-none focus:ring-4 focus:ring-[#dce8d6] disabled:cursor-wait disabled:opacity-100">
                                <svg class="send-spinner h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M20 12a8 8 0 0 1-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/>
                                </svg>
                                <span class="send-label text-xs font-semibold">生成中</span>
                                <svg class="send-arrow h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                    <p class="mt-3 text-center text-[10px] text-[#9aa097]">AI 生成的内容可能不完全准确，请结合原文核对。</p>
                </section>
            </div>
        </main>
    </div>

    <script>
        const configuredApiBase = document.querySelector('meta[name="documind-api-base"]').content.trim();
        const localHostnames = ["localhost", "127.0.0.1", "::1"];
        const isLocalPage = window.location.protocol === "file:" || localHostnames.includes(window.location.hostname);
        const pageBasePath = window.location.protocol === "file:"
            ? "/"
            : new URL(".", window.location.href).pathname;
        const API_BASE_URL = (
            configuredApiBase
                ? new URL(configuredApiBase, window.location.origin).href
                : isLocalPage
                    ? "http://127.0.0.1:8000"
                    : `${window.location.origin}${pageBasePath}`
        ).replace(/\/+$/, "");

        function apiUrl(path) {
            return `${API_BASE_URL}${path.startsWith("/") ? path : `/${path}`}`;
        }

        async function readApiJson(response) {
            const body = await response.text();
            let data;
            try {
                data = JSON.parse(body);
            } catch {
                const snippet = body.trim().slice(0, 120);
                if (/^\s*</.test(body)) {
                    throw new Error(`请求地址 ${response.url} 返回了网页而不是 API（HTTP ${response.status}）。请确认服务器已将该路径转发到 DocuMind 后端。`);
                }
                throw new Error(snippet || `服务器返回了无法识别的响应（HTTP ${response.status}）`);
            }
            if (!response.ok) {
                throw new Error(data.detail || data.message || `请求失败（HTTP ${response.status}）`);
            }
            return data;
        }

        const conversation = document.getElementById("conversation");
        const questionInput = document.getElementById("question");
        const sendButton = document.getElementById("sendButton");
        const welcome = document.getElementById("welcome");
        const ingestForm = document.getElementById("ingestForm");
        const chatForm = document.getElementById("chatForm");

        function addMessage(role, text) {
            const row = document.createElement("div");
            row.className = `${role === "user" ? "flex justify-end" : "flex items-start gap-3"} message-enter`;

            if (role === "assistant") {
                const avatar = document.createElement("div");
                avatar.className = "flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-[#eaf0e6] text-[#61745a]";
                avatar.innerHTML = '<svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.75 11.9 7.1l5.35 1.9-5.35 1.9L10 16.25l-1.9-5.35-5.35-1.9 5.35-1.9L10 1.75Z"/></svg>';
                row.appendChild(avatar);
            }

            const bubble = document.createElement("div");
            bubble.className = role === "user"
                ? "message-content max-w-[85%] rounded-2xl rounded-br-md bg-[#edf2e9] px-4 py-3 text-sm leading-6 text-[#344332] sm:max-w-[75%]"
                : "message-content min-w-0 flex-1 rounded-2xl rounded-tl-md border border-[#e9ede6] bg-white px-4 py-3.5 text-sm leading-7 text-[#41483e] shadow-panel sm:px-5";
            bubble.textContent = text;
            row.appendChild(bubble);
            conversation.appendChild(row);
            return bubble;
        }

        function askSuggestion(button) {
            questionInput.value = button.textContent.trim();
            questionInput.focus();
            questionInput.dispatchEvent(new Event("input"));
        }

        let scrollScheduled = false;
        function scheduleConversationScroll() {
            if (scrollScheduled) return;
            scrollScheduled = true;
            requestAnimationFrame(() => {
                conversation.lastElementChild?.scrollIntoView({ behavior: "auto", block: "end" });
                scrollScheduled = false;
            });
        }

        questionInput.addEventListener("input", () => {
            questionInput.style.height = "auto";
            questionInput.style.height = `${Math.min(questionInput.scrollHeight, 144)}px`;
        });

        questionInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                chatForm.requestSubmit();
            }
        });

        ingestForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const status = document.getElementById("ingestStatus");
            const button = document.getElementById("ingestButton");
            const path = document.getElementById("filePath").value.trim();
            if (!path) {
                status.textContent = "请输入本地 PDF 文件路径。";
                status.className = "mt-3 text-xs text-[#b65347]";
                return;
            }

            button.disabled = true;
            status.textContent = "正在解析并建立索引…";
            status.className = "mt-3 text-xs text-[#71836a]";
            try {
                const response = await fetch(apiUrl("/api/doc/ingest"), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file_path: path })
                });
                const data = await readApiJson(response);
                status.textContent = `已成功导入，建立了 ${data.chunks_count} 个知识片段。`;
                status.className = "mt-3 text-xs text-[#55734e]";
                document.getElementById("sidebarEmpty").classList.add("hidden");
                const sidebarDocument = document.getElementById("sidebarDocument");
                sidebarDocument.classList.remove("hidden");
                sidebarDocument.classList.add("flex");
                document.getElementById("sidebarDocumentName").textContent = path.split(/[\\/]/).pop() || path;
            } catch (error) {
                status.textContent = error.message || "请求失败，请检查网络连接后重试。";
                status.className = "mt-3 text-xs text-[#b65347]";
            } finally {
                button.disabled = false;
            }
        });

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const question = questionInput.value.trim();
            if (!question || sendButton.disabled) return;

            welcome.classList.add("hidden");
            addMessage("user", question);
            questionInput.value = "";
            questionInput.style.height = "auto";
            sendButton.disabled = true;
            sendButton.classList.add("is-loading");
            sendButton.setAttribute("aria-label", "正在生成回答");

            const answer = addMessage("assistant", "");
            answer.classList.add("assistant-streaming");
            const loading = document.createElement("div");
            loading.className = "space-y-3 py-1";
            loading.innerHTML = '<div class="flex items-center gap-2 text-xs font-medium text-[#778671]"><span class="inline-flex items-center gap-1"><span class="typing-dot h-1.5 w-1.5 rounded-full bg-[#829679]"></span><span class="typing-dot h-1.5 w-1.5 rounded-full bg-[#829679]"></span><span class="typing-dot h-1.5 w-1.5 rounded-full bg-[#829679]"></span></span><span>正在阅读资料并组织回答…</span></div><div class="space-y-2" aria-hidden="true"><div class="thinking-shimmer h-2.5 w-[88%] rounded-full"></div><div class="thinking-shimmer h-2.5 w-[66%] rounded-full"></div></div>';
            answer.appendChild(loading);
            scheduleConversationScroll();

            try {
                const response = await fetch(apiUrl("/api/chat"), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question, history: [] })
                });
                if (!response.ok) {
                    await readApiJson(response);
                }
                if (!response.body) {
                    throw new Error("服务器没有返回可读取的回答流。");
                }
                if (!(response.headers.get("content-type") || "").includes("text/event-stream")) {
                    await readApiJson(response);
                    throw new Error("服务器返回的不是流式回答，请检查后端 API 路由配置。");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let finished = false;
                let receivedText = false;

                while (!finished) {
                    const { done, value } = await reader.read();
                    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                    const events = buffer.split("\n\n");
                    buffer = events.pop() || "";

                    for (const item of events) {
                        const line = item.split("\n").find((part) => part.startsWith("data: "));
                        if (!line) continue;
                        const text = line.slice(6);
                        if (text === "[DONE]") {
                            finished = true;
                            break;
                        }
                        if (!receivedText) {
                            loading.remove();
                            answer.classList.remove("assistant-streaming");
                            receivedText = true;
                        }
                        answer.textContent += text;
                    }
                    if (done) finished = true;
                    scheduleConversationScroll();
                }

                if (buffer.startsWith("data: ")) {
                    const tail = buffer.slice(6);
                    if (tail !== "[DONE]") {
                        if (!receivedText) {
                            loading.remove();
                            answer.classList.remove("assistant-streaming");
                            receivedText = true;
                        }
                        answer.textContent += tail;
                    }
                }
                if (!receivedText) {
                    loading.remove();
                    answer.classList.remove("assistant-streaming");
                    answer.textContent = "暂时没有生成内容，请尝试重新提问。";
                }
            } catch (error) {
                loading.remove();
                answer.classList.remove("assistant-streaming");
                answer.textContent = error.message || "请求失败，请检查网络连接后重试。";
                answer.classList.add("border-[#f0d8d3]", "bg-[#fff9f7]", "text-[#9d5145]");
            } finally {
                sendButton.disabled = false;
                sendButton.classList.remove("is-loading");
                sendButton.setAttribute("aria-label", "发送问题");
                questionInput.focus();
            }
        });
    </script>
</body>
</html>
